- term: "Терминал"
  en: "Terminal"
  plain: "Окно, в котором ты набираешь команды, а не кликаешь мышкой."
  analogy: "Переписка с компьютером."
  level: 1
- term: "Процесс"
  en: "Process"
  plain: "Программа, которая работает прямо сейчас."
  analogy: "Человек, который сейчас находится в доме."
  level: 1
- term: "PID"
  en: "PID"
  plain: "Номер, который система выдаёт каждому процессу."
  analogy: "Номерок в очереди в пекарне."
  level: 1
- term: "PATH"
  en: "PATH"
  plain: "Список папок, в которых шелл ищет команды."
  analogy: "Ящики, в которых ты ищешь ножницы."
  level: 1
- term: "SSH"
  en: "SSH"
  plain: "Безопасный способ работать в терминале другого компьютера."
  analogy: "Длинный запертый коридор в другой дом."
  level: 1
- term: "tmux"
  en: "tmux"
  plain: "Сессия терминала, которая продолжает работать, когда ты уходишь."
  analogy: "Комната, где свет не гаснет."
  level: 1
- term: "IP-адрес"
  en: "IP address"
  plain: "Число, по которому машину находят в сети."
  analogy: "Адрес дома на улице."
  level: 2
- term: "Порт"
  en: "Port"
  plain: "Число, по которому выбирают одну программу на машине."
  analogy: "Пронумерованная дверь в доме."
  level: 2
- term: "localhost / 127.0.0.1"
  en: "localhost / 127.0.0.1"
  plain: "«Эта же самая машина»."
  analogy: "Домофон внутри дома."
  level: 2
- term: "0.0.0.0"
  en: "0.0.0.0"
  plain: "«Слушать на всех сетевых входах»."
  analogy: "Все двери на улицу."
  level: 2
- term: "DNS"
  en: "DNS"
  plain: "Система, которая превращает имена в IP-адреса."
  analogy: "Список контактов в телефоне."
  level: 2
- term: "Файрвол"
  en: "Firewall"
  plain: "Правила: к каким портам и откуда можно обращаться."
  analogy: "Охранник на входе."
  level: 2
- term: "Reverse proxy (обратный прокси)"
  en: "Reverse proxy"
  plain: "Сервер, который принимает запросы и передаёт их приложениям."
  analogy: "Администратор у входа."
  level: 2
- term: "SSH-туннель"
  en: "SSH tunnel"
  plain: "Личный путь от твоего порта к порту на другой машине."
  analogy: "Личный коридор."
  level: 2
- term: "API"
  en: "API"
  plain: "Набор правил, по которым программы просят что-то друг у друга."
  analogy: "Меню в ресторане."
  level: 3
- term: "Эндпоинт"
  en: "Endpoint"
  plain: "Один адрес в API, который делает одно дело."
  analogy: "Одно блюдо в меню."
  level: 3
- term: "Код ответа"
  en: "Status code"
  plain: "Число, которое говорит, как прошёл запрос."
  analogy: "Выражение лица официанта."
  level: 3
- term: "Валидация"
  en: "Validation"
  plain: "Проверка входных данных до того, как ими пользоваться."
  analogy: "Официант повторяет твой заказ вслух."
  level: 3
- term: "Цикл событий (event loop)"
  en: "Event loop"
  plain: "Единственный работник, который по очереди выполняет весь `async`-код."
  analogy: "Один официант на много столиков."
  level: 3
- term: "Переменная окружения"
  en: "Environment variable"
  plain: "Настройка, которую программа получает снаружи, а не из своего кода."
  analogy: "Записка на холодильнике."
  level: 3
- term: "Образ"
  en: "Image"
  plain: "Упакованный шаблон приложения со всем, что ему нужно; только для чтения."
  analogy: "Рецепт и собранный бокс в морозилке."
  level: 4
- term: "Контейнер"
  en: "Container"
  plain: "Запущенная копия образа."
  analogy: "Один открытый ланч-бокс."
  level: 4
- term: "Том (volume)"
  en: "Volume"
  plain: "Хранилище, которое живёт вне контейнера."
  analogy: "Полка на настоящей кухне."
  level: 4
- term: "Compose"
  en: "Compose"
  plain: "Файл, который описывает несколько контейнеров, работающих вместе."
  analogy: "План рассадки для ланч-боксов."
  level: 4
- term: "Проверка здоровья (healthcheck)"
  en: "Healthcheck"
  plain: "Маленький тест, который говорит, работает ли сервис."
  analogy: "«Духовка включена?»"
  level: 4
- term: "Миграция"
  en: "Migration"
  plain: "Изменение структуры базы данных, у которого есть версия."
  analogy: "Страница в дневнике ремонта дома."
  level: 5
- term: "Индекс"
  en: "Index"
  plain: "Структура, с которой база данных быстро находит строки."
  analogy: "Библиотечный каталог."
  level: 5
- term: "Эмбеддинг"
  en: "Embedding"
  plain: "Список чисел, который обозначает смысл текста."
  analogy: "Булавка на карте смыслов."
  level: 5
- term: "Векторный поиск"
  en: "Vector search"
  plain: "Поиск текстов, чьи эмбеддинги близки к эмбеддингу вопроса."
  analogy: "«Покажи булавки рядом с этой»."
  level: 5
- term: "Кэш"
  en: "Cache"
  plain: "Быстрое временное хранилище для ответов, которые уже посчитаны."
  analogy: "Стикеры на мониторе."
  level: 5
- term: "Токен"
  en: "Token"
  plain: "Кусочек текста, который модель читает или пишет; слово — это один токен или несколько."
  analogy: "Кусочек."
  level: 6
- term: "Контекстное окно"
  en: "Context window"
  plain: "Сколько токенов модель может обработать за один вызов."
  analogy: "Стол шефа."
  level: 6
- term: "Стриминг"
  en: "Streaming"
  plain: "Ответ отправляется по кусочкам, пока он создаётся."
  analogy: "Блюда подают по мере готовности."
  level: 6
- term: "Температура"
  en: "Temperature"
  plain: "Сколько случайности модель допускает, выбирая слова."
  analogy: "Насколько шеф сегодня настроен на эксперименты."
  level: 6
- term: "Структурированный вывод"
  en: "Structured output"
  plain: "Модель отвечает в заданном формате, который можно проверить."
  analogy: "Анкета вместо письма в свободной форме."
  level: 6
- term: "RAG"
  en: "RAG"
  plain: "Модели дают найденные документы, и она отвечает по ним."
  analogy: "Экзамен с открытой книгой."
  level: 7
- term: "Чанк"
  en: "Chunk"
  plain: "Кусок документа, который хранится и ищется как одно целое."
  analogy: "Одна страница, которую дали студенту."
  level: 7
- term: "Гибридный поиск"
  en: "Hybrid search"
  plain: "Поиск по смыслу и поиск по словам вместе."
  analogy: "Спросить и библиотекаря, и каталог."
  level: 7
- term: "Реранкер"
  en: "Reranker"
  plain: "Модель, которая заново расставляет найденные чанки по настоящей полезности."
  analogy: "Второй помощник, более придирчивый."
  level: 7
- term: "Эталонный набор (golden set)"
  en: "Golden set"
  plain: "Постоянный набор вопросов с известными ответами, по которому измеряют качество."
  analogy: "Лист с правильными ответами."
  level: 7
- term: "Hit rate@k"
  en: "Hit rate@k"
  plain: "Как часто нужный чанк попадает в первые k результатов."
  analogy: "«Помощник принёс нужную страницу?»"
  level: 7
- term: "Достоверность (faithfulness)"
  en: "Faithfulness"
  plain: "Подтверждается ли каждое утверждение в ответе источниками."
  analogy: "«Это есть в книге или выдумано?»"
  level: 7
- term: "CI"
  en: "CI"
  plain: "Автоматические проверки, которые запускаются на каждый push."
  analogy: "Робот-ревьюер, который никогда не спит."
  level: 8
- term: "Откат"
  en: "Rollback"
  plain: "Возврат к предыдущей рабочей версии."
  analogy: "Вчерашнее меню."
  level: 8
- term: "Задержка p95"
  en: "p95 latency"
  plain: "Время, за которое успевают завершиться 95% запросов."
  analogy: "Сколько ждут невезучие гости."
  level: 8
- term: "Ранбук"
  en: "Runbook"
  plain: "Страница, на которой написано, как управлять сервисом."
  analogy: "Чек-лист открытия кафе."
  level: 8
