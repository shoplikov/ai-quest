name: Deploy

# Runs when a version tag is pushed:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys: refuse to talk to a server that is not ours.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CONF
          Host quest
              HostName $DEPLOY_HOST
              User $DEPLOY_USER
              IdentityFile ~/.ssh/deploy_key
              StrictHostKeyChecking yes
          CONF
      - name: Deploy ${{ github.ref_name }}
        env:
          QUEST_TAG: ${{ github.ref_name }}
        run: ./scripts/deploy.sh quest
      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null "http://$DEPLOY_HOST/" && echo "Site is up" && exit 0
            sleep 5
          done
          echo "Site did not answer on http://$DEPLOY_HOST/" && exit 1
